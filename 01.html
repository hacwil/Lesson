<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --danger: red;
            --secondary: gray;
        }
  
        .header {
            background-color: var(--secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px;
            font-weight: 700;
            color: whitesmoke;
            width: 100%;
        }

        .heading {
            top: 0;
            position: fixed;
            width: 100%;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 1px 1px 7px;
            height: 70px;
            width: 100%;
            top: 10;
        }

        .menu {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            font-size: 30px;
            font-weight: bold;
            color: black;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
        }

        .logo img {
            height: 40px;
        }

        .icon {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .icon .com-flag {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        .icon i {
            font-size: 20px;
        }

        .icon input {
            height: 30px;
            border-radius: 5px;
            width: 250px;
            border: none;
            box-shadow: 1px 1px 3px;
        }

        .container {
            margin-top: 20000px;
        }
    </style>
</head>

<body>

    <div class="heading">

        <div class="header">
            <div class="header">សូមស្វាគមន៍ US14D</div>
        </div>

        <nav class="navbar">

            <ul class="menu">
                <li><a href="#">Women</a></li>
                <li><a href="#">Men</a></li>
                <li>
                    <a href="#" class="beauty" style="color: red;">
                        Beauty
                    </a>
                </li>
                <li><a href="#">Kids</a></li>
                <li><a href="#">Life Style</a></li>
            </ul>

            <div class="logo">
                <img src="https://randomshapes.com/images/logos/ZANDO-NEW-LOGO-2025.png"
                    alt="Logo">
            </div>

            <div class="icon">

                <img src="https://encrypted-tbn0.gstatic.com/images"
                    alt="Cambodia Flag" class="com-flag">

                <input type="text" placeholder="Search">

                <i class="fa-regular fa-user"></i>
                <i class="fa-regular fa-bell"></i>
                <i class="fa-solid fa-cart-shopping"></i>

            </div>
   
            <div class="x"></div>

        </nav>

    </div>

    <div class="container">
        Hello world
    </div>

</body>

</html>
