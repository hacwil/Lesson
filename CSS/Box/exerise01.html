<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 1px solid white;
            width: 500px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .header{
            width: 500px;
            border-radius: 10px;
            height: 50px;
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box-content {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        .box-content .box1 {
            width: 40%;
            border-radius: 10px;
            background-color: aqua;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-content .box2 {
            width: 60%;
            border-radius: 10px;
            background-color: rgb(16, 94, 94);
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box3 {
            width: 500px;
            border-radius: 10px;
            background-color: red;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">

        <header class="header">
            Box1
        </header>

        <div class="box-content">
            <div class="box1">Box1</div>
            <div class="box2">Box2</div>
        </div>

        <div class="box3">Box3</div>

    </div>
</body>
</html>
