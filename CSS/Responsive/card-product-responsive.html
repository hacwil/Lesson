<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: burlywood;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .product-card {
            border-radius: 30px;
            background-color: white;
            width: 495px;
            height: 560px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
        }

        .product-card img {
            width: 100%;
            height: 300px;
            border-radius: 12px;
        }
        .text {
            font-size: 20px;
            font-weight: bold;
            color: #292d40;
            line-height: 32px;
        }
        .product-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 5px;
        }
        button {
            background-color: #202020;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 13px 17px;
            font-size: 19px;
            cursor: pointer;
           
        }
        .product-name {
            color: gray;
            font-size: 19px;
            margin-top: 10px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .product-color {
            display: flex;
            gap: 14px;
            margin-top: 30px;
        }

        .product-color div {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            cursor: pointer;
        }
        .blue {
            background-color: #20b9e9;
            outline: 4px solid #e0e0e0;
           
        }
        .green {
            background-color: #60cba8;
        }
        .mint {
            background-color: #a0eee0;
        }
        .pink {
            background-color: #f69ab3;
        }
        .product-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: min(100% - 32px, 1220px)
        }
        @media screen and (max-width: 1220px){
            .product-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
        }
        @media screen and (max-width: 576px) {
            body {
                padding: 20px;
            }
            .product-container {
                grid-template-columns: 1fr;
                display: grid;
            }
            
        }
    </style>
</head>
<body>
    <div class="product-container">
        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcRrBmL__dcLscyMFqpMw0XSLHFkuRpBWDWwSyVRxlXydp_tiTkd" alt="Nike Sneaker">

            <div class="product-info">
                <div class="text">Sneakers Off-White<br>2024</div>
                <button>+ Add to Cart</button>
            </div>
            <div class="product-name"> NIKE</div>
            <div class="price">$38.00</div>
            
            <div class="product-color">
                <div class="blue"></div>
                <div class="green"></div>
                <div class="mint"></div>
                <div class="pink"></div>
            </div>
        </div>
        
        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwHPwJPuqgdLPqyOWAlcSwiUqb9JmdLvMsHSoF6yE17g&s=10" alt="Nike Sneaker">

            <div class="product-info">
                <div class="text">Sneakers Off-White<br>2024</div>
                <button>+ Add to Cart</button>
            </div>
            <div class="product-name"> NIKE</div>
            <div class="price">$38.00</div>
            
            <div class="product-color">
                <div class="blue"></div>
                <div class="green"></div>
                <div class="mint"></div>
                <div class="pink"></div>
            </div>
        </div>
        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjYczy3zOHQgvwW_MVIAFRA_pAzhurqiztyUDDfEcwEQ&s=10" alt="Nike Sneaker">

            <div class="product-info">
                <div class="text">Sneakers Off-White<br>2024</div>
                <button>+ Add to Cart</button>
            </div>
            <div class="product-name"> NIKE</div>
            <div class="price">$38.00</div>
            
            <div class="product-color">
                <div class="blue"></div>
                <div class="green"></div>
                <div class="mint"></div>
                <div class="pink"></div>
            </div>
        </div>
    </div>
</body>
</html>
