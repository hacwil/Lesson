<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .banner{
            width: min(1250px - 32px, 100%);
            height: 470px;
            background-color: brown;
            margin: auto;
            background-image: url(https://t4.ftcdn.net/jpg/03/20/68/71/360_F_320687108_3UZ13l44Ob5cel208W7DaRnD5BR9DfY7.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .button{
            display: flex;
            margin-top: 370px;
        }
        .banner button{
            height: 40px;
            border-radius: 10px;
            width: 250px;
            border: none;
            font-weight: bold;
            font-size: 18px;
            color: gray;
            margin-right: 260px;
        }
    </style>
</head>
<body>
    <div class="banner"> 
        <div class="button">
            <button>BUY NOW</button>
        </div>
    </div>
</body>
</html>
