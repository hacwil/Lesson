<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>BBC Navbar Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .navbar {
            display: flex;
            height: 50px;
            width: 100%;
            justify-content: space-between;
            z-index: 1000;
            top: 0;
            position: fixed;
            align-items: center;
            box-shadow: 1px 2px 5px 1px;
            background-color: #000000;
        }
        .news{
            margin-top: 1200px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
            padding-right: 15px;
            border-right: 1px solid #333333;
        }

        .logo-block {
            background-color: #ffffff;
            color: #000000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin-right: 3px;
            font-size: 16px;
            font-family: 'Arial Black', Gadget, sans-serif;
        }
        .nav-links {
            display: flex;
            align-items: center;
            height: 100%;
            list-style: none;
            flex-grow: 1;
            gap:10px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-item {
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 12px;
            border-right: 1px solid #333333;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
        }
        .nav-item:hover {
            border-bottom: 4px solid #ff0000;
        }
        .sign-in {
            font-size: 12px;
        }
        .more-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 20px;
        }
        .arrow-down {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 4px solid #ffffff;
            margin-left: 8px;
        }
        .search-container {
            display: flex;
            align-items: center;
            padding-left: 15px;
            height: 100%;
            margin-right: 30px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            height: 26px;
            width: 200px;
            

        }
        .search-input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 12px;
        }

        .search-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container">
            <span class="logo-block">B</span>
            <span class="logo-block">B</span>
            <span class="logo-block">C</span>
            <a class="nav-item sign-in"><span class="profile-icon"><i class="fa-solid fa-user"></i></span>Sign in</a>
        </div>
        <div class="nav-links">
            <a class="nav-item">News</a>
            <a class="nav-item">Sport</a>
            <a class="nav-item">Reel</a>
            <a class="nav-item">Worklife</a>
            <a class="nav-item">Travel</a>
            <a class="nav-item">Future</a>
            <a class="nav-item more-item">More<span class="arrow-down"></span></a>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Search">
                <button class="search-button"></button>
            </div>
        </div>
    </nav>

    <div class="news">
        news
    </div>
